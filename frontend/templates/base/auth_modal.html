<!-- Auth Modal Overlay -->
{% load static %}
<div id="authModalOverlay" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md hidden">
    <div class="glass-panel w-full max-w-md mx-4 rounded-3xl p-6 sm:p-8 border border-cyan-500/30 shadow-2xl relative bg-slate-900 text-slate-100">

        <!-- Close Button -->
        <button onclick="closeAuthModal()" class="absolute top-6 right-6 text-slate-400 hover:text-white text-lg">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <!-- Header Title -->
        <div class="mb-6">
            <h3 id="modalTitle" class="text-2xl font-extrabold text-white">Sign In to Fundlense-AI</h3>
            <p id="modalSubtitle" class="text-xs text-slate-400 mt-1">Enter your credentials to access your secure terminal.</p>
        </div>

        <!-- API Message / Error Alert Box -->
        <div id="authAlertBox" class="hidden mb-4 p-3 rounded-xl text-xs font-semibold"></div>

        <!-- FORM 1: LOGIN -->
        <div id="formLogin" class="auth-form-step">
            <form onsubmit="submitLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1.5 uppercase">Username / Mobile</label>
                    <input type="text" id="loginUsername" required placeholder="8830437088" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs font-bold text-slate-300 uppercase">Password</label>
                        <button type="button" onclick="switchModalView('forgot')" class="text-xs text-cyan-400 hover:underline">Forgot?</button>
                    </div>
                    <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400">
                </div>
                <button type="submit" id="btnLoginSubmit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 text-white font-extrabold text-sm shadow-lg transition-all mt-2">
                    Sign In
                </button>
            </form>
            <div class="text-center mt-5 text-xs text-slate-400">
                Don't have an account? <button onclick="switchModalView('signupStep1')" class="text-cyan-400 font-bold hover:underline">Register free</button>
            </div>
        </div>

        <!-- FORM 2: SIGNUP STEP 1 -->
        <div id="formSignupStep1" class="auth-form-step hidden">
            <form onsubmit="submitSignupStep1(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1.5 uppercase">Mobile Number</label>
                    <input type="tel" id="signupMobile" required placeholder="8830437088" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1.5 uppercase">Email Address</label>
                    <input type="email" id="signupEmail" required placeholder="name@example.com" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400">
                </div>
                <button type="submit" id="btnSignupSubmit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 text-white font-extrabold text-sm shadow-lg transition-all mt-2">
                    Continue to OTP Verification
                </button>
            </form>
            <div class="text-center mt-5 text-xs text-slate-400">
                Already registered? <button onclick="switchModalView('login')" class="text-cyan-400 font-bold hover:underline">Sign In</button>
            </div>
        </div>

        <!-- FORM 3: OTP VERIFICATION -->
        <div id="formOtpVerify" class="auth-form-step hidden">
            <form onsubmit="submitVerifyOtp(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1.5 uppercase text-center">Enter 6-Digit OTP</label>
                    <input type="text" id="otpCode" required maxlength="6" placeholder="121653" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-center text-xl tracking-widest text-white focus:outline-none focus:border-cyan-400 font-mono">
                </div>
                <div class="flex justify-between items-center text-xs">
                    <span id="otpTimerDisplay" class="text-amber-400 font-medium">Resend in 60s</span>
                    <button type="button" id="resendOtpBtn" disabled onclick="triggerResendOtp()" class="text-cyan-400 font-bold hover:underline disabled:opacity-50 disabled:cursor-not-allowed">Resend OTP</button>
                </div>
                <button type="submit" id="btnVerifyOtpSubmit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 text-white font-extrabold text-sm shadow-lg transition-all mt-2">
                    Verify OTP
                </button>
            </form>
        </div>

        <!-- FORM 4: SET PASSWORD -->
        <div id="formSetPassword" class="auth-form-step hidden">
            <form onsubmit="submitSetPassword(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1.5 uppercase">New Password</label>
                    <input type="password" id="newPassword" required placeholder="Password@123" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1.5 uppercase">Confirm Password</label>
                    <input type="password" id="confirmPassword" required placeholder="Password@123" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400">
                </div>
                <button type="submit" id="btnSetPassSubmit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 text-white font-extrabold text-sm shadow-lg transition-all mt-2">
                    Complete & Access Terminal
                </button>
            </form>
        </div>

        <!-- FORM 5: FORGOT PASSWORD -->
        <div id="formForgot" class="auth-form-step hidden">
            <form onsubmit="submitForgotStep1(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1.5 uppercase">Registered Mobile</label>
                    <input type="tel" id="forgotMobile" required placeholder="8830437088" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1.5 uppercase">Registered Email</label>
                    <input type="email" id="forgotEmail" required placeholder="name@example.com" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400">
                </div>
                <button type="submit" id="btnForgotSubmit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 text-white font-extrabold text-sm shadow-lg transition-all mt-2">
                    Send Reset OTP
                </button>
            </form>
            <div class="text-center mt-5 text-xs text-slate-400">
                Remember password? <button onclick="switchModalView('login')" class="text-cyan-400 font-bold hover:underline">Sign In</button>
            </div>
        </div>

    </div>
</div>

<!-- Required Utility Scripts -->
<script src="{% static 'js/secure_storage.js' %}"></script>
<script src="{% static 'js/secureFetch.js' %}"></script>
<script src="{% static 'js/alerts.js' %}"></script>
<script src="{% static 'js/loader.js' %}"></script>

<script>
    // --- GLOBAL SCOPE STATE VARIABLES ---
    let userState = { mobile: '', email: '' };
    let activeOtpType = 'SIGNUP';
    let countdownTimerRef = null;
    let tempVerifiedOtp = '';

    function openAuthModal(viewName = 'login') {
        document.getElementById('authModalOverlay').classList.remove('hidden');
        switchModalView(viewName);
    }

    function closeAuthModal() {
        document.getElementById('authModalOverlay').classList.add('hidden');
        if (typeof hideAlert === 'function') hideAlert('authAlertBox');
    }

    function switchModalView(viewName) {
        if (typeof hideAlert === 'function') hideAlert('authAlertBox');
        document.querySelectorAll('.auth-form-step').forEach(el => el.classList.add('hidden'));
        const title = document.getElementById('modalTitle');
        const subtitle = document.getElementById('modalSubtitle');

        if (viewName === 'login') {
            document.getElementById('formLogin').classList.remove('hidden');
            title.textContent = "Sign In to Fundlense-AI";
            subtitle.textContent = "Enter your credentials to access your secure terminal.";
        } else if (viewName === 'signupStep1') {
            document.getElementById('formSignupStep1').classList.remove('hidden');
            title.textContent = "Create Free Account";
            subtitle.textContent = "Enter your mobile and email to receive verification OTP.";
        } else if (viewName === 'otp') {
            document.getElementById('formOtpVerify').classList.remove('hidden');
            title.textContent = "Verify Security OTP";
            subtitle.textContent = "Check your email/mobile for the 6-digit code.";
            startCountdownTimer();
        } else if (viewName === 'setpassword') {
            document.getElementById('formSetPassword').classList.remove('hidden');
            title.textContent = "Set Account Password";
            subtitle.textContent = "Create a robust password to secure your portfolio.";
        } else if (viewName === 'forgot') {
            document.getElementById('formForgot').classList.remove('hidden');
            title.textContent = "Reset Password";
            subtitle.textContent = "Provide your registered contact info to receive reset OTP.";
        }
    }

    // --- SUBMISSION HANDLERS ---

    async function submitLogin(e) {
        e.preventDefault();
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        const submitBtn = document.getElementById('btnLoginSubmit');

        if (typeof showLoader === 'function') showLoader('Signing into your terminal...');
        if (typeof setButtonLoading === 'function') setButtonLoading(submitBtn, true, 'Authenticating...');

        try {
            const res = await fetch('/accounts/v1/auth/login/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken'),
                },
                credentials: 'include',
                body: JSON.stringify({ username, password }),
            });

            const data = await res.json();
            if (typeof hideLoader === 'function') hideLoader();
            if (typeof setButtonLoading === 'function') setButtonLoading(submitBtn, false);

            if (res.ok && data && data.st === 200) {
                if (typeof showAlert === 'function') showAlert(data.msg || "Login successful!", 'success', 'authAlertBox');
                sessionStorage.setItem("is_logged_in", "true");
                setTimeout(() => window.location.href = "/dashboard/", 800);
            } else {
                if (typeof showAlert === 'function') showAlert((data && data.msg) || "Invalid credentials.", 'error', 'authAlertBox');
            }
        } catch (err) {
            if (typeof hideLoader === 'function') hideLoader();
            if (typeof setButtonLoading === 'function') setButtonLoading(submitBtn, false);
            if (typeof showAlert === 'function') showAlert("Network connection error.", 'error', 'authAlertBox');
        }
    }

    async function submitSignupStep1(e) {
        e.preventDefault();
        userState.mobile = document.getElementById('signupMobile').value.trim();
        userState.email = document.getElementById('signupEmail').value.trim();
        activeOtpType = 'SIGNUP';
        const submitBtn = document.getElementById('btnSignupSubmit');

        if (typeof showLoader === 'function') showLoader('Sending verification OTP...');
        if (typeof setButtonLoading === 'function') setButtonLoading(submitBtn, true, 'Sending OTP...');

        try {
            const res = await fetch('/accounts/v1/auth/signup/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ mobile: userState.mobile, email: userState.email })
            });
            const data = await res.json();
            if (typeof hideLoader === 'function') hideLoader();
            if (typeof setButtonLoading === 'function') setButtonLoading(submitBtn, false);

            if (res.ok && (data.st === 201 || data.st === 200)) {
                if (typeof showAlert === 'function') showAlert(data.msg || "OTP sent successfully!", 'success', 'authAlertBox');
                setTimeout(() => switchModalView('otp'), 600);
            } else {
                if (typeof showAlert === 'function') showAlert(data.msg || "Signup error.", 'error', 'authAlertBox');
            }
        } catch (err) {
            if (typeof hideLoader === 'function') hideLoader();
            if (typeof setButtonLoading === 'function') setButtonLoading(submitBtn, false);
            if (typeof showAlert === 'function') showAlert("Network connection error.", 'error', 'authAlertBox');
        }
    }

    async function submitForgotStep1(e) {
        e.preventDefault();
        userState.mobile = document.getElementById('forgotMobile').value.trim();
        userState.email = document.getElementById('forgotEmail').value.trim();
        activeOtpType = 'FORGOT_PASSWORD';
        const submitBtn = document.getElementById('btnForgotSubmit');

        if (typeof showLoader === 'function') showLoader('Triggering password reset...');
        if (typeof setButtonLoading === 'function') setButtonLoading(submitBtn, true, 'Sending Reset OTP...');

        try {
            const res = await fetch('/accounts/v1/auth/resend-otp/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ mobile: userState.mobile, email: userState.email, otp_type: activeOtpType })
            });
            const data = await res.json();
            if (typeof hideLoader === 'function') hideLoader();
            if (typeof setButtonLoading === 'function') setButtonLoading(submitBtn, false);

            if (res.ok && data.st === 200) {
                if (typeof showAlert === 'function') showAlert("Reset OTP sent successfully.", 'success', 'authAlertBox');
                setTimeout(() => switchModalView('otp'), 600);
            } else {
                if (typeof showAlert === 'function') showAlert(data.msg || "Failed to trigger reset OTP.", 'error', 'authAlertBox');
            }
        } catch (err) {
            if (typeof hideLoader === 'function') hideLoader();
            if (typeof setButtonLoading === 'function') setButtonLoading(submitBtn, false);
            if (typeof showAlert === 'function') showAlert("Network connection error.", 'error', 'authAlertBox');
        }
    }

    async function submitVerifyOtp(e) {
        e.preventDefault();
        const otp = document.getElementById('otpCode').value.trim();
        const submitBtn = document.getElementById('btnVerifyOtpSubmit');

        if (typeof showLoader === 'function') showLoader('Verifying OTP code...');
        if (typeof setButtonLoading === 'function') setButtonLoading(submitBtn, true, 'Verifying...');

        try {
            const res = await fetch('/accounts/v1/auth/verify-otp/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ mobile: userState.mobile, email: userState.email, otp: otp, otp_type: activeOtpType })
            });
            const data = await res.json();
            if (typeof hideLoader === 'function') hideLoader();
            if (typeof setButtonLoading === 'function') setButtonLoading(submitBtn, false);

            if (res.ok && data.st === 200) {
                if (typeof showAlert === 'function') showAlert(data.msg || "OTP verified!", 'success', 'authAlertBox');
                tempVerifiedOtp = otp;
                setTimeout(() => switchModalView('setpassword'), 600);
            } else {
                if (typeof showAlert === 'function') showAlert(data.msg || "Invalid OTP code.", 'error', 'authAlertBox');
            }
        } catch (err) {
            if (typeof hideLoader === 'function') hideLoader();
            if (typeof setButtonLoading === 'function') setButtonLoading(submitBtn, false);
            if (typeof showAlert === 'function') showAlert("Network connection error.", 'error', 'authAlertBox');
        }
    }

    async function triggerResendOtp() {
        if (typeof showLoader === 'function') showLoader('Resending OTP...');
        try {
            const res = await fetch('/accounts/v1/auth/resend-otp/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ mobile: userState.mobile, email: userState.email, otp_type: activeOtpType })
            });
            const data = await res.json();
            if (typeof hideLoader === 'function') hideLoader();

            if (res.ok && data.st === 200) {
                if (typeof showAlert === 'function') showAlert(data.msg || "OTP resent successfully.", 'success', 'authAlertBox');
                startCountdownTimer();
            } else {
                if (typeof showAlert === 'function') showAlert(data.msg || "Could not resend OTP.", 'error', 'authAlertBox');
            }
        } catch (err) {
            if (typeof hideLoader === 'function') hideLoader();
            if (typeof showAlert === 'function') showAlert("Network error.", 'error', 'authAlertBox');
        }
    }

    async function submitSetPassword(e) {
        e.preventDefault();
        const password = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const submitBtn = document.getElementById('btnSetPassSubmit');

        if (password !== confirmPassword) {
            if (typeof showAlert === 'function') showAlert("Passwords do not match.", 'error', 'authAlertBox');
            return;
        }

        if (typeof showLoader === 'function') showLoader('Updating password & securing account...');
        if (typeof setButtonLoading === 'function') setButtonLoading(submitBtn, true, 'Saving...');

        try {
            const res = await fetch('/accounts/v1/auth/set-password/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ mobile: userState.mobile, email: userState.email, otp: tempVerifiedOtp, otp_type: activeOtpType, password: password })
            });
            const data = await res.json();
            if (typeof hideLoader === 'function') hideLoader();
            if (typeof setButtonLoading === 'function') setButtonLoading(submitBtn, false);

            if (res.ok && data.st === 200) {
                if (typeof showAlert === 'function') showAlert(data.msg || "Password updated successfully!", 'success', 'authAlertBox');
                if (data.data && data.data.access_token && typeof SecureStorage !== 'undefined') {
                    SecureStorage.setItem('access_token', data.data.access_token);
                    SecureStorage.setItem('refresh_token', data.data.refresh_token);
                }
                setTimeout(() => window.location.href = "/dashboard/", 1000);
            } else {
                if (typeof showAlert === 'function') showAlert(data.msg || "Failed to set password.", 'error', 'authAlertBox');
            }
        } catch (err) {
            if (typeof hideLoader === 'function') hideLoader();
            if (typeof setButtonLoading === 'function') setButtonLoading(submitBtn, false);
            if (typeof showAlert === 'function') showAlert("Network connection error.", 'error', 'authAlertBox');
        }
    }

    function startCountdownTimer() {
        let seconds = 60;
        const display = document.getElementById('otpTimerDisplay');
        const btn = document.getElementById('resendOtpBtn');
        if (btn) btn.disabled = true;
        if (countdownTimerRef) clearInterval(countdownTimerRef);
        countdownTimerRef = setInterval(() => {
            seconds--;
            if (display) display.textContent = `Resend in ${seconds}s`;
            if (seconds <= 0) {
                clearInterval(countdownTimerRef);
                if (display) display.textContent = `Didn't receive code?`;
                if (btn) btn.disabled = false;
            }
        }, 1000);
    }
</script>
